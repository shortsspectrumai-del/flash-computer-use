[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d1-computer-use-mcp"
version = "0.1.0"
description = "Flash computer use: fast hybrid visual & accessibility computer-use MCP server with human-like pointer control and canvas drawing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.10,<2", "httpx>=0.27", "pillow>=10", "playwright>=1.49", "mss>=9", "pyautogui>=0.9.54"]

[project.optional-dependencies]
local = ["torch", "torchvision", "transformers>=5.14"]
accessibility = ["pywinauto>=0.6.9; sys_platform == 'win32'", "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'", "pyobjc-framework-Cocoa; sys_platform == 'darwin'"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
flash-computer-use = "d1_computer_use_mcp.server:main"
flash-check = "d1_computer_use_mcp.check:main"
flash-doctor = "d1_computer_use_mcp.portability:doctor"
flash-config = "d1_computer_use_mcp.portability:configure"
d1-computer-use-mcp = "d1_computer_use_mcp.server:main"
d1-check = "d1_computer_use_mcp.check:main"
d1-doctor = "d1_computer_use_mcp.portability:doctor"
d1-config = "d1_computer_use_mcp.portability:configure"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
