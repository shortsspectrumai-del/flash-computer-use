[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d1-computer-use-mcp"
version = "0.1.0"
description = "Flash computer use: ultra-fast hybrid visual & accessibility computer-use MCP server with human-like physical mouse movement, browser/desktop automation, and Paint/canvas drawing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "computer-use",
    "gui-agent",
    "browser-automation",
    "desktop-automation",
    "playwright",
    "pyautogui",
    "ollama",
    "liquid-ai",
    "d1",
    "vision-language-model",
    "accessibility",
    "human-mouse",
    "canvas-drawing",
    "cursor",
    "claude-desktop",
    "codex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = ["mcp[cli]>=1.10,<2", "httpx>=0.27", "pillow>=10", "playwright>=1.49", "mss>=9", "pyautogui>=0.9.54"]

[project.urls]
Homepage = "https://github.com/shortsspectrumai-del/flash-computer-use"
Repository = "https://github.com/shortsspectrumai-del/flash-computer-use"
Issues = "https://github.com/shortsspectrumai-del/flash-computer-use/issues"

[project.optional-dependencies]
local = ["torch", "torchvision", "transformers>=5.14"]
accessibility = ["pywinauto>=0.6.9; sys_platform == 'win32'", "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'", "pyobjc-framework-Cocoa; sys_platform == 'darwin'"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
flash-computer-use = "d1_computer_use_mcp.server:main"
flash-check = "d1_computer_use_mcp.check:main"
flash-doctor = "d1_computer_use_mcp.portability:doctor"
flash-config = "d1_computer_use_mcp.portability:configure"
d1-computer-use-mcp = "d1_computer_use_mcp.server:main"
d1-check = "d1_computer_use_mcp.check:main"
d1-doctor = "d1_computer_use_mcp.portability:doctor"
d1-config = "d1_computer_use_mcp.portability:configure"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
